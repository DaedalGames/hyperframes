name: Docs

permissions:
  contents: read

# Suppress hyperframes CLI telemetry from HeyGen's own CI runs.
# External users' CI continues to emit telemetry unless they set this themselves.
env:
  HYPERFRAMES_NO_TELEMETRY: "1"

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "DOCS_GUIDELINES.md"
      - "packages/core/schemas/**"
      - "scripts/sync-schemas.ts"
      # A CLI change can strand a command or flag the docs still show.
      - "packages/cli/src/**"
      - "scripts/cli-command-tree.ts"
      - "scripts/check-docs-cli-references.mjs"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "DOCS_GUIDELINES.md"
      - "packages/core/schemas/**"
      - "scripts/sync-schemas.ts"
      # A CLI change can strand a command or flag the docs still show.
      - "packages/cli/src/**"
      - "scripts/cli-command-tree.ts"
      - "scripts/check-docs-cli-references.mjs"
      - ".github/workflows/docs.yml"

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Check schema mirror (core → docs)
        run: npx tsx scripts/sync-schemas.ts --check

      - name: Validate build
        working-directory: docs
        run: npx mint validate

      - name: Check broken links
        working-directory: docs
        # --check-redirects also resolves every redirect destination, so a
        # restructure cannot leave a redirect pointing at a page it removed.
        run: npx mint broken-links --check-redirects

  cli-references:
    name: CLI references
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - run: bash scripts/ci/install-workspace-dependencies.sh

      # The command tree loads the CLI's command modules, which import core's generated sources.
      - run: bun run --cwd packages/core build

      - name: Check every command and flag the docs show exists in the CLI
        run: node scripts/check-docs-cli-references.mjs
