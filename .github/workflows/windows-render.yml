name: Windows render verification

permissions:
  contents: read

env:
  HYPERFRAMES_NO_TELEMETRY: "1"

on:
  workflow_dispatch:

jobs:
  probe:
    name: "agent-mode first batch probe ${{ matrix.runner }}"
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3, 4]
    steps:
      - name: Disable Windows Defender real-time monitoring
        shell: pwsh
        continue-on-error: true
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install dependencies
        shell: pwsh
        run: bun install --frozen-lockfile --linker=hoisted
      - name: Build test prerequisites
        shell: pwsh
        run: |
          bun run --filter '@hyperframes/{parsers,lint,studio-server}' build
          bun run --cwd packages/core build
      - name: Probe
        shell: pwsh
        run: |
          bun --version
          Get-CimInstance Win32_Processor | Select-Object NumberOfLogicalProcessors
          $env:ROUNDS = "60"; $env:VARIANTS = "test,nocache"; $env:LOADS = "loaded"
          node scripts/agentmode-probe.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: agentmode-probe-${{ matrix.runner }}
          path: agentmode-probe.json
          if-no-files-found: ignore
          retention-days: 3
